[package]
name = "corepolicy-manager-wrapper"
version = "1.0.0"
edition = "2024"
license = "MPL-2.0"
description = "Wrapper crate that packages the CoreShift Policy daemon for CorePolicyManager"

[[bin]]
name = "corepolicy"
path = "src/main.rs"


[[bin]]
name = "inoi_refresh_idle"
path = "src/bin/inoi_refresh_idle.rs"

[[bin]]
name = "utensil-poker"
path = "src/bin/utensil_poker.rs"

[[bin]]
name = "utensil-webui"
path = "src/bin/utensil_webui.rs"

[dependencies]
libc = "0.2"
coreshift-core = { git = "https://github.com/CoreShiftD/CoreShift-Core.git", branch = "main", version = "1.0.0" }
coreshift-policy = { git = "https://github.com/CoreShiftD/CoreShift-Policy.git", branch = "main", version = "1.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
incremental = false
strip = "none"
